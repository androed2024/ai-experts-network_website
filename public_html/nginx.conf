server {
    listen 80;
    server_name ai-experts.11mind.com;
    root /usr/share/nginx/html;
    index index.html;

    # Serve /de/ as default root
    location = / {
        return 301 /de/;
    }

    # Preserve language-neutral entry points used by the original site.
    location = /unser-ansatz/ {
        return 301 /de/unser-ansatz/;
    }

    location = /ki-expertinnen/ {
        return 301 /de/ki-expertinnen/;
    }

    location = /ki-workshops-kompetenzaufbau/ {
        return 301 /de/ki-workshops-kompetenzaufbau/;
    }

    location = /ki-strategieberatung-bedarfsanalyse/ {
        return 301 /de/ki-strategieberatung-bedarfsanalyse/;
    }

    location = /ki-executive-coaching-change/ {
        return 301 /de/ki-executive-coaching-change/;
    }

    location = /ki-umsetzung-automatisierung/ {
        return 301 /de/ki-umsetzung-automatisierung/;
    }

    location = /ki-keynotes/ {
        return 301 /de/ki-keynotes/;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
}
